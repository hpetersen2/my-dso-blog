name: Create or Update PR

on:
  push:
    branches-ignore:
      - main
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create Pull Request with GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.PR_TOKEN }}
          GH_TOKEN: ${{ secrets.PR_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          BASE_BRANCH: main  # target branch of the
        run: |
          BRANCH_NAME=$(echo "${GITHUB_REF}" | sed 's|refs/heads/||')
          EXISTING=$(gh pr list --repo "$REPO_OWNER/$REPO_NAME" --state open \
            --head "$BRANCH_NAME" --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "Open PR for '$BRANCH_NAME' already exists."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/$REPO_OWNER/$REPO_NAME/pulls \
            -d "$(jq -n \
              --arg title "PR for $BRANCH_NAME" \
              --arg head "$BRANCH_NAME" \
              --arg base "$BASE_BRANCH" \
              '{title: $title, head: $head, base: $base, body: "Automatically created Pull Request to merge $head --> $base"}')"